<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="搜尋臺北 YouBike 2.0 即時站點、可借車輛與可還空位，收藏常用站點。"><title>騎點 Bike Now｜臺北即時單車地圖</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--green:#184e40;--lime:#d8ef78;--ink:#203b33;--muted:#6d7c72;--line:#e4e9df}*{box-sizing:border-box}body{margin:0;background:#f7f8f2;color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:white;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.logo{background:var(--green);color:var(--lime);border-radius:15px;padding:9px 12px;font-size:27px}.brand b{font-size:24px;letter-spacing:1px}.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:3px}.tag{font-size:13px;border:1px solid var(--line);padding:8px 13px;border-radius:24px}main{display:grid;grid-template-columns:370px 1fr;height:calc(100dvh - 88px)}aside{padding:26px 22px 0;display:flex;flex-direction:column;min-height:0;background:#fcfdf9}h1{font-size:28px;margin:5px 0 8px;letter-spacing:-1px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:700}.intro{font-size:13px;color:var(--muted);line-height:1.8;margin:0 0 20px}.search{width:100%;border:1px solid #dbe1d4;border-radius:12px;padding:13px;background:white;color:var(--ink)}.filters{display:flex;gap:7px;margin:11px 0}.filters button{flex:1;border:1px solid var(--line);padding:9px 5px;border-radius:9px;background:white;font-size:12px}.filters button.active{background:var(--green);color:white;border-color:var(--green)}select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}.listhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:20px 0 10px}.stations{overflow:auto;flex:1;padding-bottom:15px}.card{background:white;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;padding:14px;transition:.15s}.card:hover{border-color:#86a58c;transform:translateY(-1px)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{background:none;border:0;text-align:left;font-weight:650;color:var(--ink);padding:0;font-size:14px;line-height:1.5}.star{border:0;background:none;color:#7b8979;font-size:23px;padding:0 3px}.star.saved{color:#b77e13}.address{font-size:11px;color:var(--muted);margin:5px 0 12px;line-height:1.5}.counts{display:flex;gap:24px;font-size:11px;color:var(--muted)}.counts b{font-size:22px;color:var(--green);margin-right:4px;font-weight:650}.counts b.zero{color:#b77e13}.mapwrap{position:relative;min-width:0}#map{width:100%;height:100%;background:#e8eddf}.mapbar{position:absolute;top:20px;left:55px;right:20px;z-index:500;background:#ffffffee;backdrop-filter:blur(10px);border:1px solid white;border-radius:13px;padding:13px 17px;box-shadow:0 4px 20px #25473510;display:flex;align-items:center;justify-content:space-between;gap:12px}.status{font-size:12px;line-height:1.6}.status b{display:block;font-size:13px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#38835f;margin-right:7px}.actions{display:flex;gap:6px}.actions button,.popup button{border:0;background:var(--green);color:white;border-radius:8px;padding:10px 13px;font-size:12px}.actions button:disabled{opacity:.5}.legend{position:absolute;bottom:28px;left:20px;z-index:500;background:white;border-radius:10px;padding:12px 15px;font-size:11px;box-shadow:0 2px 15px #0001;display:flex;gap:14px}.key{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.marker{width:32px;height:32px;border:3px solid white;border-radius:50% 50% 50% 5px;transform:rotate(-45deg);background:#24684e;box-shadow:0 2px 7px #0004;display:grid;place-items:center}.marker span{transform:rotate(45deg);color:white;font-size:11px;font-weight:bold}.marker.empty{background:#b97b29}.marker.off{background:#839087}.popup{min-width:210px}.popup h3{font-size:16px;margin:5px 0 8px}.popup p{color:#667466;line-height:1.7}.popup .counts{margin:14px 0}.popup button{width:100%}.foot{font-size:10px;line-height:1.7;color:var(--muted);border-top:1px solid var(--line);padding:12px 0}.foot a{color:inherit}.emptymsg{padding:28px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:2000;background:var(--green);color:white;border-radius:10px;padding:12px 20px;font-size:13px;display:none}@media(max-width:760px){header{height:70px;padding:0 18px}.brand b{font-size:20px}.tag{font-size:11px}.logo{font-size:23px}main{height:auto;display:flex;flex-direction:column}.mapwrap{order:-1;height:49dvh;min-height:300px}aside{padding:20px 18px 0}.stations{max-height:420px}.mapbar{left:52px;top:12px;right:12px;padding:10px;align-items:flex-start}.actions button{padding:9px;font-size:11px}.status{font-size:10px}.status b{font-size:11px}.legend{bottom:22px;left:12px;padding:8px;font-size:10px}h1{font-size:25px}.intro{margin-bottom:12px}.leaflet-popup-content{margin:14px}}
</style></head><body><header><div class="brand"><div class="logo" aria-hidden="true">↗</div><div><b>騎點 <span style="font-weight:400">Bike Now</span></b><small>YOUR NEXT RIDE STARTS HERE</small></div></div><span class="tag">臺北市 · YouBike 2.0</span></header><main><aside><span class="eyebrow">EXPLORE THE CITY</span><h1>找個騎點，出發吧。</h1><p class="intro">一眼找到可借單車與還車空位，<br>讓下一段城市日常，輕鬆一點。</p><input id="search" class="search" placeholder="搜尋站名、地址或行政區…" aria-label="搜尋站點"><div class="filters" aria-label="站點篩選"><button class="active" data-filter="all">全部站點</button><button data-filter="rent">有車可借</button><button data-filter="return">有位可還</button><button data-filter="saved">☆ 收藏</button></div><select id="district" aria-label="行政區"><option value="">所有行政區</option></select><div class="listhead"><span id="resultCount">準備載入站點</span><span>依地圖中心距離排序</span></div><div id="stations" class="stations"><div class="emptymsg">正在讀取臺北市即時資料…</div></div><footer class="foot">每 60 秒自動更新 · 收藏與地圖位置保存在此瀏覽器<br>資料：<a href="https://data.gov.taipei/dataset/detail?id=c6bc8aed-557d-41d5-bfb1-8da24f78f2fb" target="_blank" rel="noopener">臺北市資料大平臺 ↗</a> · 地圖 © OpenStreetMap contributors<br>車輛數量以現場狀況為準。</footer></aside><section class="mapwrap" aria-label="YouBike 站點地圖"><div id="map"></div><div class="mapbar"><div id="status" class="status" role="status" aria-live="polite"><b>正在連線至即時資料</b>每 60 秒自動更新</div><div class="actions"><button id="locate">◎ 定位</button><button id="refresh">↻ 更新</button></div></div><div class="legend"><span><i class="key" style="background:#24684e"></i>有車可借</span><span><i class="key" style="background:#b97b29"></i>暫無單車</span><span><i class="key" style="background:#839087"></i>暫停服務</span></div></section></main><div id="toast" role="status"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
// 公開資料 API；latitude / longitude 為經緯度，數量由 API 自動更新。
const API='https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json';
const $=id=>document.getElementById(id);const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storage={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('瀏覽器無法儲存設定，收藏將僅保留於本次使用。')}}};
let saved=storage.get('bike-now-favorites',[]);if(!Array.isArray(saved))saved=[];let stations=[],filter='all',markers=new Map(),busy=false,userMarker=null;let toastTimer;
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3500)}
let view=storage.get('bike-now-view',null);if(!view||!Array.isArray(view.center)||view.center.length!==2||!view.center.every(Number.isFinite)||!Number.isFinite(view.zoom))view={center:[25.0478,121.517],zoom:14};
if(typeof L==='undefined'){$('status').textContent='地圖元件載入失敗，請確認網路連線後重新整理。';$('stations').textContent='無法載入 Leaflet 地圖元件。'}else{
const map=L.map('map',{zoomControl:false}).setView(view.center,Math.min(18,Math.max(8,view.zoom)));L.control.zoom({position:'topleft'}).addTo(map);
const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);let tileWarned=false;tiles.on('tileerror',()=>{if(!tileWarned){toast('部分地圖圖磚載入失敗，請確認網路連線。');tileWarned=true}});
function name(s){return s.sna.replace(/^YouBike2\.0_/,'')}function active(s){return String(s.act)==='1'}function amount(s){return `<div class="counts"><span><b class="${s.rent===0?'zero':''}">${s.rent}</b>可借車輛</span><span><b>${s.ret}</b>可還空位</span></div>`}
function favorite(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];storage.set('bike-now-favorites',saved);render();const s=stations.find(x=>x.sno===id);if(markers.has(id))markers.get(id).setPopupContent(popup(s));}
function popup(s){const div=document.createElement('div');div.className='popup';div.innerHTML=`<div class="eyebrow">${escapeHTML(s.sarea)} · ${active(s)?'營運中':'暫停服務'}</div><h3>${escapeHTML(name(s))}</h3><p>${escapeHTML(s.ar)}</p>${amount(s)}<p style="font-size:11px">來源更新：${escapeHTML(s.mday||s.infoTime||'未提供')}<br>經緯度：${s.latitude}, ${s.longitude}</p>`;const btn=document.createElement('button');btn.textContent=saved.includes(s.sno)?'★ 取消收藏':'☆ 收藏這個站點';btn.onclick=()=>favorite(s.sno);div.append(btn);return div}
function filtered(){const q=$('search').value.trim().toLowerCase(),d=$('district').value;return stations.filter(s=>(!d||s.sarea===d)&&(!q||[s.sna,s.ar,s.sarea].join(' ').toLowerCase().includes(q))&&(filter!=='rent'||active(s)&&s.rent>0)&&(filter!=='return'||active(s)&&s.ret>0)&&(filter!=='saved'||saved.includes(s.sno)))}
function focus(s){map.setView([s.latitude,s.longitude],17);markers.get(s.sno)?.openPopup()}
function render(){const rows=filtered(),ids=new Set(rows.map(s=>s.sno));for(const [id,m]of markers){if(ids.has(id)){if(!map.hasLayer(m))m.addTo(map)}else if(map.hasLayer(m))map.removeLayer(m)}const center=map.getCenter();rows.sort((a,b)=>center.distanceTo([a.latitude,a.longitude])-center.distanceTo([b.latitude,b.longitude]));$('resultCount').textContent=`${rows.length.toLocaleString()} 個站點${rows.length>60?' · 列出最近 60 站':''}`;$('stations').replaceChildren();if(!rows.length){$('stations').innerHTML='<div class="emptymsg">沒有符合條件的站點。<br>試試其他關鍵字、行政區，或收藏常用站點。</div>';return}for(const s of rows.slice(0,60)){const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="row"><button class="name">${escapeHTML(name(s))}</button><button class="star ${saved.includes(s.sno)?'saved':''}" aria-label="${saved.includes(s.sno)?'取消收藏':'收藏'} ${escapeHTML(name(s))}" aria-pressed="${saved.includes(s.sno)}">${saved.includes(s.sno)?'★':'☆'}</button></div><p class="address">${escapeHTML(s.sarea)} · ${active(s)?escapeHTML(s.ar):'暫停服務'}</p>${amount(s)}`;el.querySelector('.name').onclick=()=>focus(s);el.querySelector('.star').onclick=()=>favorite(s.sno);$('stations').append(el)}}
async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;$('refresh').textContent='更新中';const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),18000);try{const res=await fetch(API,{signal:controller.signal,cache:'no-store'});if(!res.ok)throw Error(`HTTP ${res.status}`);const data=await res.json();if(!Array.isArray(data))throw Error('資料格式不正確');const next=data.filter(s=>s.sno&&typeof s.sna==='string'&&s.latitude!=null&&s.longitude!=null&&Number.isFinite(Number(s.latitude))&&Number.isFinite(Number(s.longitude))&&Number(s.latitude)>=-90&&Number(s.latitude)<=90&&Number(s.longitude)>=-180&&Number(s.longitude)<=180).map(s=>({...s,sno:String(s.sno),latitude:Number(s.latitude),longitude:Number(s.longitude),rent:Math.max(0,Number(s.available_rent_bikes)||0),ret:Math.max(0,Number(s.available_return_bikes)||0)}));if(!next.length)throw Error('沒有有效站點');stations=next;const openId=[...markers].find(([,m])=>m.isPopupOpen())?.[0];for(const m of markers.values())map.removeLayer(m);markers.clear();for(const s of stations){const cls=!active(s)?'off':s.rent===0?'empty':'';const icon=L.divIcon({className:'',html:`<div class="marker ${cls}"><span>${active(s)?s.rent:'−'}</span></div>`,iconSize:[32,32],iconAnchor:[16,32],popupAnchor:[0,-30]});markers.set(s.sno,L.marker([s.latitude,s.longitude],{icon,title:name(s)}).bindPopup(()=>popup(s)))}const selected=$('district').value;$('district').replaceChildren(new Option('所有行政區',''));[...new Set(stations.map(s=>s.sarea))].sort().forEach(d=>$('district').add(new Option(d,d)));$('district').value=selected;render();if(openId&&markers.has(openId)&&map.hasLayer(markers.get(openId)))markers.get(openId).openPopup();const source=stations.map(s=>s.srcUpdateTime||s.mday||'').sort().at(-1);const parsed=Date.parse(source.replace(' ','T')+'+08:00');const stale=!Number.isFinite(parsed)||Date.now()-parsed>5*60*1000;$('status').innerHTML=`<b><span class="dot" style="background:${stale?'#b97b29':'#38835f'}"></span>${stale?'來源資料可能延遲':'已取得站點資料'} · ${stations.length.toLocaleString()} 站</b>來源更新：${escapeHTML(source||'未提供')} · 每 60 秒擷取`;}catch(e){$('status').innerHTML=`<b style="color:#9d641f">連線失敗${stations.length?' · 畫面保留上次資料':''}</b>請檢查網路後按更新，60 秒後自動重試。`;if(!stations.length)$('stations').innerHTML='<div class="emptymsg">暫時無法取得站點資料。<br>請連上網路，再按右上角「更新」。</div>';}finally{clearTimeout(timeout);busy=false;$('refresh').disabled=false;$('refresh').textContent='↻ 更新'}}
map.on('moveend',()=>{const c=map.getCenter();storage.set('bike-now-view',{center:[c.lat,c.lng],zoom:map.getZoom()});render()});$('search').addEventListener('input',render);$('district').addEventListener('change',render);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});$('refresh').onclick=refresh;$('locate').onclick=()=>{if(!navigator.geolocation){toast('此瀏覽器不支援定位。');return}navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:'#3478c6',fillOpacity:1}).addTo(map).bindPopup('你目前的位置');map.setView([lat,lng],16);if(lat<24.95||lat>25.22||lng<121.45||lng>121.68)toast('目前僅提供臺北市站點，可縮小地圖查看。')},()=>toast('無法取得位置，請允許瀏覽器定位權限。'),{timeout:10000,maximumAge:60000})};refresh();setInterval(()=>{if(!document.hidden)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
}
</script></body></html>
