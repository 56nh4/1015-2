<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>府城光影地圖｜臺南電影院探索</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzxVF0RPu5IZnLZkY4uIA=" crossorigin="">
<style>
:root{--navy:#151d32;--muted:#748098;--ink:#202b40;--red:#f36b59;--line:#e5eaf1;--bg:#f4f6fa}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:var(--bg)}header{height:76px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.brandmark{background:var(--navy);width:42px;height:42px;border-radius:13px;color:white;display:grid;place-items:center;font-size:22px}.brand strong{display:block;font-size:19px;letter-spacing:.5px}.brand span{font-size:11px;color:var(--muted)}header .right{font-size:12px;color:#8b95a7}.shell{display:grid;grid-template-columns:380px 1fr;height:calc(100dvh - 76px);min-height:550px}.side{background:white;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}.intro{padding:29px 25px 21px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;color:var(--red);font-weight:800;letter-spacing:2px}.intro h1{font-size:28px;margin:9px 0 9px;letter-spacing:-.5px}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.8}.stats{display:flex;gap:10px;margin-top:22px}.stat{background:#f6f7fb;border:1px solid #edf0f5;flex:1;border-radius:13px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:var(--muted);font-size:11px}.filters{padding:18px 24px 14px;border-bottom:1px solid var(--line)}.search{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 13px;font:inherit;font-size:13px;outline:none}.search:focus{border-color:#9ba9c5}.chips{display:flex;gap:7px;margin:13px 0 0;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:99px;padding:7px 12px;background:white;cursor:pointer;font-size:11px;color:#657087;font-family:inherit}.chip.active{color:white;background:var(--navy);border-color:var(--navy)}.listtop{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 7px;font-size:12px;font-weight:700}.listtop small{font-weight:400;color:var(--muted)}.places{overflow-y:auto;flex:1;padding:0 14px 20px}.place{width:100%;display:flex;gap:11px;text-align:left;align-items:flex-start;border:1px solid transparent;background:transparent;border-radius:12px;padding:13px 10px;cursor:pointer;font:inherit}.place:hover,.place.selected{background:#f7f8fc;border-color:#edf0f7}.dot{width:36px;height:36px;flex-shrink:0;background:#fff0ee;border-radius:11px;display:grid;place-items:center;color:var(--red);font-size:18px}.place h3{font-size:13px;margin:0 0 5px;line-height:1.5}.place p{font-size:11px;color:var(--muted);margin:0 0 5px;line-height:1.5}.place .tag{font-size:10px;color:#77829a}.place .tag.ok{color:#178568}.toolbar{padding:13px 22px;border-top:1px solid var(--line);display:flex;gap:8px;background:white}.btn{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--line);padding:10px 14px;border-radius:9px;background:white;font-weight:600}.btn.primary{background:var(--navy);color:white;border-color:var(--navy);flex:1}.mapwrap{position:relative;min-width:0}#map{width:100%;height:100%}.mapbadge{position:absolute;top:18px;left:18px;z-index:450;background:white;box-shadow:0 4px 15px #1f294017;border-radius:10px;padding:12px 15px;font-size:12px;max-width:min(420px,calc(100% - 35px))}.mapbadge b{display:block}.mapbadge span{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.6}.legend{position:absolute;right:18px;bottom:28px;z-index:450;background:white;padding:12px 15px;border-radius:10px;box-shadow:0 3px 17px #1f29401a;font-size:11px}.legend i{display:inline-block;width:11px;height:11px;background:var(--red);border-radius:50%;margin-right:7px}.popup h3{font-size:15px;margin:0 0 9px}.popup p{margin:6px 0;color:#657087;font-size:12px}.popup a{color:#df6256;text-decoration:none}.pin{width:30px;height:30px;display:grid;place-items:center;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--red);box-shadow:0 3px 13px #b94c4777;border:2px solid white}.pin span{transform:rotate(45deg);font-size:15px}.tip{font-size:11px;color:#a0a8b6;margin:8px 24px 0}.empty{color:var(--muted);font-size:12px;padding:25px;text-align:center}@media(max-width:750px){header{height:65px;padding:0 18px}.shell{display:flex;flex-direction:column;height:auto}.side{order:2;min-height:460px}.mapwrap{order:1;height:47vh;min-height:330px}.intro{padding:20px}.intro h1{font-size:23px}.stats{margin-top:15px}.places{max-height:350px}.mapbadge{top:12px;left:12px}}
</style></head><body>
<header><div class="brand"><div class="brandmark">🎬</div><div><strong>府城光影地圖</strong><span>TAINAN CINEMA EXPLORER</span></div></div><div class="right">Leaflet × OpenStreetMap</div></header>
<main class="shell"><aside class="side"><section class="intro"><div class="eyebrow">EXPLORE TAINAN</div><h1>城市裡的光影座標</h1><p>探索臺南的電影院，點選清單或地圖標記，查看地址、電話及地圖位置。</p><div class="stats"><div class="stat"><b id="datasetCount">10</b><small>CSV 電影院</small></div><div class="stat"><b id="mapCount">—</b><small>地圖資料點</small></div><div class="stat"><b id="savedCount">0</b><small>我的收藏</small></div></div></section>
<section class="filters"><input id="search" class="search" placeholder="⌕  搜尋電影院名稱或地址" aria-label="搜尋電影院"><div class="chips"><button class="chip active" data-filter="all">全部影院</button><button class="chip" data-filter="中西區">中西區</button><button class="chip" data-filter="東區">東區</button><button class="chip" data-filter="麻豆區">麻豆區</button><button class="chip" data-filter="favorites">★ 我的收藏</button></div></section>
<div class="listtop">電影院清單 <small id="status">準備取得 OSM 座標…</small></div><div class="places" id="places"></div><div class="toolbar"><button class="btn" id="reset">回到臺南</button><button class="btn primary" id="reload">↻ 更新地圖資料</button></div><div class="tip">名單來自上傳的 CSV；標記資料來自 OSM，並非即時場次或座位資訊。</div></aside>
<section class="mapwrap"><div id="map"></div><div class="mapbadge"><b id="loadTitle">正在載入電影院地點</b><span id="loadDesc">從 OpenStreetMap Overpass API 取得附經緯度的公開地圖資料</span></div><div class="legend"><i></i> OSM 電影院標記</div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const CSV_DATA = [{"name": "今日大戲院有限公司(今日戲院)", "address": "台南市中西區中正路249號", "phone": "(06)2205151"}, {"name": "全美戲院有限公司(全美戲院)", "address": "台南市中西區永福路二段187號", "phone": "(06)2224726"}, {"name": "麻豆戲院", "address": "台南市麻豆區興中路106號3樓", "phone": "(06)5722159"}, {"name": "南台育樂事業有限公司(南台影城)", "address": "台南市中西區友愛街317號", "phone": "(06)2287581"}, {"name": "新光影城股份有限公司台南西門分公司(新光影城)", "address": "台南市中西區西門路一段658號", "phone": "(06)3031260"}, {"name": "國賓影城股份有限公司台南東區分公司（一館）", "address": "台南市東區中華東路一段88號", "phone": "(06)2347166"}, {"name": "國賓影城股份有限公司台南中華分公司（二館旗艦館）", "address": "台南市東區中華東路一段66號3樓", "phone": "(06)2347166"}, {"name": "威秀影城股份有限公司台南分公司(台南大遠百威秀影城)", "address": "台南市中西區公園路60號5樓", "phone": "(06)6005566"}, {"name": "威秀影城股份有限公司台南東區分公司(台南南紡威秀影城)", "address": "台南市東區中華東路一段366號5樓", "phone": "(06)2372255"}, {"name": "威秀影城股份有限公司台南中西區分公司(台南FOCUS威秀影城)", "address": "台南市中西區中山路166號11樓", "phone": "(06)2223566"}];
const LS_FAV='tainan_cinema_favorites_v1',LS_CACHE='tainan_cinema_osm_cache_v1';
let favorite=new Set(JSON.parse(localStorage.getItem(LS_FAV)||'[]')),currentFilter='all',markers=[],osmData=[],selected='';
const $=id=>document.getElementById(id);
const map=L.map('map',{zoomControl:false}).setView([22.997,120.213],12);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const group=L.featureGroup().addTo(map);
const norm=s=>String(s||'').toLowerCase().replace(/股份有限公司|有限公司|分公司|台南|臺南|影城|戲院|電影城|威秀|國賓|新光|[\s（）()－-]/g,'');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const matching=(o,c)=>{
 const a=norm(o.name),b=norm(c.name),addr=String(o.address||'');
 if(a.length>=2&&b.includes(a)||b.length>=2&&a.includes(b))return true;
 const name=String(o.name||'').toLowerCase(),csvName=String(c.name).toLowerCase();
 return name.length>=3&&csvName.includes(name)||addr.length>=8&&c.address.includes(addr);
};
function mapMatch(c){return osmData.find(o=>matching(o,c))||null}
function markerIcon(){return L.divIcon({className:'',html:'<div class="pin"><span>🎞</span></div>',iconSize:[30,34],iconAnchor:[14,33],popupAnchor:[0,-32]})}
function redrawMarkers(){group.clearLayers();markers=[];
 osmData.forEach(o=>{
  if(currentFilter==='favorites'&&!CSV_DATA.some(c=>favorite.has(c.name)&&matching(o,c)))return;
  if(!['all','favorites'].includes(currentFilter)&&!String(o.address||o.name).includes(currentFilter)&&!CSV_DATA.some(c=>c.address.includes(currentFilter)&&matching(o,c)))return;
  const q=$('search').value.trim().toLowerCase();if(q&&!((o.name+' '+o.address).toLowerCase().includes(q))&&!CSV_DATA.some(c=>matching(o,c)&&(c.name+' '+c.address).toLowerCase().includes(q)))return;
  const c=CSV_DATA.find(c=>matching(o,c));const name=c?.name||o.name;
  const popup=`<div class="popup"><h3>🎬 ${esc(name)}</h3><p>📍 ${esc(c?.address||o.address||'OSM 尚未提供地址')}</p>${c?.phone?`<p>☎ ${esc(c.phone)}</p>`:''}<p><a href="https://www.openstreetmap.org/?mlat=${o.lat}&mlon=${o.lon}#map=17/${o.lat}/${o.lon}" target="_blank" rel="noopener">在 OpenStreetMap 查看 ↗</a></p></div>`;
  const m=L.marker([o.lat,o.lon],{icon:markerIcon()}).addTo(group).bindPopup(popup);m.on('click',()=>{selected=c?.name||'';renderList()});markers.push({data:o,marker:m});
 });$('mapCount').textContent=markers.length;
}
function renderList(){let q=$('search').value.trim().toLowerCase();let rows=CSV_DATA.filter(c=>{if(currentFilter==='favorites'&&!favorite.has(c.name))return false;if(!['all','favorites'].includes(currentFilter)&&!c.address.includes(currentFilter))return false;return(c.name+' '+c.address+' '+c.phone).toLowerCase().includes(q)});
 $('places').innerHTML=rows.length?rows.map(c=>{const m=mapMatch(c),f=favorite.has(c.name);return `<button class="place ${selected===c.name?'selected':''}" data-name="${esc(c.name)}"><div class="dot">🎟</div><div style="min-width:0;flex:1"><h3>${esc(c.name)}</h3><p>${esc(c.address)}</p><div class="tag ${m?'ok':''}">${m?'● 已對應 OSM 座標':'○ 此筆 CSV 尚無可確認的座標'}　☎ ${esc(c.phone)}</div></div><span class="star" data-fav="${esc(c.name)}" style="font-size:20px;color:${f?'#f0a345':'#bfc7d5'}">${f?'★':'☆'}</span></button>`}).join(''):'<div class="empty">找不到符合條件的電影院</div>';
 $('savedCount').textContent=favorite.size;
 document.querySelectorAll('.place').forEach(el=>el.addEventListener('click',e=>{
 const name=el.dataset.name;if(e.target.closest('[data-fav]')){favorite.has(name)?favorite.delete(name):favorite.add(name);localStorage.setItem(LS_FAV,JSON.stringify([...favorite]));renderList();if(currentFilter==='favorites')redrawMarkers();return}
 selected=name;renderList();const c=CSV_DATA.find(x=>x.name===name),o=mapMatch(c);if(o){map.setView([o.lat,o.lon],16,{animate:true});markers.find(x=>x.data===o)?.marker.openPopup()}else{$('loadTitle').textContent='此筆資料尚未定位';$('loadDesc').textContent='上傳的 CSV 缺少座標；OSM 未找到能安全對應的地點，故不顯示推測標記。'}
 }))
}
function parseElements(elements){return elements.map(x=>{const lat=x.lat??x.center?.lat,lon=x.lon??x.center?.lon,t=x.tags||{};return {id:x.type+'/'+x.id,lat:Number(lat),lon:Number(lon),name:t['name:zh']||t.name||'未命名電影院',address:[t['addr:city'],t['addr:district'],t['addr:street'],t['addr:housenumber']].filter(Boolean).join('')||t['addr:full']||''}}).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon));}
async function updateData(force=false){$('reload').disabled=true;$('loadTitle').textContent='正在取得公開地圖資料';$('loadDesc').textContent='查詢臺南地區 OSM amenity=cinema 資料…';
 const cache=JSON.parse(localStorage.getItem(LS_CACHE)||'null');
 if(!force&&cache?.data?.length&&Date.now()-cache.time<6*3600e3){osmData=cache.data;finish('已載入儲存的公開地圖資料','可按「更新地圖資料」重新查詢 OpenStreetMap');return;}
 const query='[out:json][timeout:25];(node["amenity"="cinema"](22.88,120.09,23.21,120.44);way["amenity"="cinema"](22.88,120.09,23.21,120.44);relation["amenity"="cinema"](22.88,120.09,23.21,120.44););out center;';
 const endpoints=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.nchc.org.tw/api/interpreter'];let error='';
 for(const endpoint of endpoints){try{const ctl=new AbortController(),id=setTimeout(()=>ctl.abort(),14000);let response;try{response=await fetch(endpoint+'?data='+encodeURIComponent(query),{signal:ctl.signal})}finally{clearTimeout(id)}if(!response.ok)throw Error('HTTP '+response.status);const json=await response.json();if(!Array.isArray(json.elements))throw Error('資料格式不正確');osmData=parseElements(json.elements);localStorage.setItem(LS_CACHE,JSON.stringify({data:osmData,time:Date.now()}));finish('已更新公開地圖資料',`資料來源：OpenStreetMap · 更新於 ${new Date().toLocaleString('zh-TW')}`);return}catch(e){error=e.message;}}
 if(cache?.data){osmData=cache.data;finish('連線失敗，顯示上次資料',`API 暫時無法連線（${error}），已改用 LocalStorage 快取。`)}else{osmData=[];finish('暫時無法取得地圖標記','公開地圖 API 可能繁忙或受網路限制，請稍後按「更新地圖資料」。CSV 清單仍可瀏覽。')}
}
function finish(title,desc){$('loadTitle').textContent=title;$('loadDesc').textContent=desc;$('reload').disabled=false;redrawMarkers();renderList()}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{currentFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));redrawMarkers();renderList()}));
$('search').addEventListener('input',()=>{redrawMarkers();renderList()});$('reset').addEventListener('click',()=>map.setView([22.997,120.213],12));$('reload').addEventListener('click',()=>updateData(true));renderList();updateData();
</script></body></html>
